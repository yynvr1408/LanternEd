      50% { transform: scale(1.15); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    @keyframes ripple {
      0% { transform: scale(0); opacity: 1; }
      100% { transform: scale(3); opacity: 0; }
    }
    .ripple-effect {
      position: absolute;
      border-radius: 50%;
      background: rgba(16, 185, 129, 0.4);
      width: 30px;
      height: 30px;
      pointer-events: none;
      animation: ripple 0.6s cubic-bezier(0, 0, 0.2, 1);
    }
    .cursor-pointer-sim {
      transition: all 0.7s cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: none;
      z-index: 9999;
    }
    .cinema-screen {
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.08);

    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

      const ripple = document.createElement("div");
      ripple.className = "ripple-effect";
      ripple.style.left = virtualCursor.style.left;
      ripple.style.top = virtualCursor.style.top;
      cinemaStage.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    }

    function speakNarration(text) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.05 * playbackSpeed;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    function loadScene(idx) {
      if (idx < 0 || idx >= scenes.length) return;
      currentSceneIdx = idx;
      const scene = scenes[idx];

      urlBar.textContent = scene.url;
      sceneCounter.textContent = `Scene ${idx + 1} / ${scenes.length}`;
      narrationTitle.textContent = scene.chapter;
      narrationText.textContent = scene.narration;

      document.querySelectorAll(".chapter-card").forEach((card, i) => {
        if (i === idx) {
          card.className = "chapter-card p-3 rounded-xl border border-emerald-500 bg-emerald-950/40 text-left transition";
        } else {
          card.className = "chapter-card p-3 rounded-xl border border-slate-800 bg-slate-900/60 hover:border-slate-700 text-left transition";
        }
      });

      scene.render(canvas);
      speakNarration(scene.narration);

      if (scene.animate) {
        scene.animate();
      }

      const progress = ((idx) / scenes.length) * 100;
      timelineBar.style.width = `${progress}%`;
      updateTimerDisplay();
    }

    function updateTimerDisplay() {
      const elapsedMins = Math.floor((currentSceneIdx * 15) / 60);
      const elapsedSecs = (currentSceneIdx * 15) % 60;
      timeDisplay.textContent = `${String(elapsedMins).padStart(2, '0')}:${String(elapsedSecs).padStart(2, '0')} / 02:00`;
    }

    function play() {
      isPlaying = true;
      playPauseBtn.textContent = "❚❚";
      advanceSceneLoop();
    }

    function pause() {
      isPlaying = false;
      playPauseBtn.textContent = "▶";
      clearTimeout(sceneTimer);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    }

    async function advanceSceneLoop() {
      if (!isPlaying) return;
      loadScene(currentSceneIdx);
      const scene = scenes[currentSceneIdx];
      const waitMs = (scene.duration * 1000) / playbackSpeed;
      
      sceneTimer = setTimeout(() => {
        if (currentSceneIdx < scenes.length - 1) {
          currentSceneIdx++;
          advanceSceneLoop();
        } else {
          pause();
          timelineBar.style.width = "100%";
        }
      }, waitMs);
    }

    playPauseBtn.addEventListener("click", () => {
      if (isPlaying) pause(); else play();
    });

    prevBtn.addEventListener("click", () => {
      pause();
      if (currentSceneIdx > 0) loadScene(currentSceneIdx - 1);
    });

    nextBtn.addEventListener("click", () => {
      pause();
      if (currentSceneIdx < scenes.length - 1) loadScene(currentSceneIdx + 1);
    });

    speedBtn.addEventListener("click", () => {
      if (playbackSpeed === 1.0) playbackSpeed = 1.5;
      else if (playbackSpeed === 1.5) playbackSpeed = 2.0;
      else playbackSpeed = 1.0;
      speedBtn.textContent = `${playbackSpeed.toFixed(1)}x`;
      if (isPlaying) {
        pause();
        play();
      }
    });

    voiceBtn.addEventListener("click", () => {
      voiceEnabled = !voiceEnabled;
      voiceLabel.textContent = `Voice Narration: ${voiceEnabled ? 'ON' : 'OFF'}`;
      if (!voiceEnabled && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    });

    document.querySelectorAll(".chapter-card").forEach(card => {
      card.addEventListener("click", () => {
        pause();
        const sceneNum = parseInt(card.getAttribute("data-scene"), 10);
        loadScene(sceneNum);
      });
    });

    document.getElementById("fullscreen-btn").addEventListener("click", () => {
      if (!document.fullscreenElement) {
        cinemaStage.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    });

    let mediaRecorder = null;
    let recordedChunks = [];
    const recBtn = document.getElementById("rec-btn");
    const recBtnText = document.getElementById("rec-btn-text");
    const downloadVideoBtn = document.getElementById("download-video-btn");

    recBtn.addEventListener("click", async () => {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        recBtn.className = "px-4 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold transition flex items-center space-x-2";
        recBtnText.textContent = "Start Video Recording";
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({
          video: {
            displaySurface: "browser",
            width: { ideal: 1920 },
            height: { ideal: 1080 },
            frameRate: { ideal: 60 }
          },
          audio: true
        });

        recordedChunks = [];
        const mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
          ? "video/webm;codecs=vp9"
          : "video/webm";

        mediaRecorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 5000000 });

        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) {
            recordedChunks.push(e.data);
          }
        };

        mediaRecorder.onstop = () => {
          const blob = new Blob(recordedChunks, { type: "video/webm" });
          const url = URL.createObjectURL(blob);
          downloadVideoBtn.classList.remove("hidden");
          downloadVideoBtn.onclick = () => {
            const a = document.createElement("a");
            a.href = url;
            a.download = "LanternED_Complete_System_Walkthrough.webm";
            a.click();
          };
          stream.getTracks().forEach(track => track.stop());
        };

        mediaRecorder.start();
        recBtn.className = "px-4 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-bold transition flex items-center space-x-2";
        recBtnText.textContent = "Stop Recording (Saving...)";

        currentSceneIdx = 0;
        play();

      } catch (err) {
        alert("Screen recording permission was not granted or is unsupported: " + err.message);
      }
    });

    loadScene(0);
  </script>
</body>
</html>
