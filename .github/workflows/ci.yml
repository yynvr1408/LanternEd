name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install ffmpeg (media tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libpq-dev
      - run: pip install -r requirements-dev.txt
      - name: Single Alembic head
        run: |
          set -eo pipefail
          heads=$(alembic heads | wc -l)
          test "$heads" -eq 1 || (echo "Multiple Alembic heads: merge them" && alembic heads && exit 1)
      - name: Run Backend Tests
        env:
          APP_ENV: testing
        run: |
          set -eo pipefail
          pytest -v --tb=short 2>&1 | tee test_results.log
      - name: Report Failures to Step Summary
        if: failure()
        run: |
          set -eo pipefail
          echo "### Pytest Failure Details" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "(FAILED|ERROR)" -A 15 test_results.log | head -n 100 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
