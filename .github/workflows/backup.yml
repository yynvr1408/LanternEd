name: Nightly database backup

on:
  schedule:
    - cron: "30 20 * * *"  # 02:00 IST
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: check_secrets
        run: |
          if [ -z "${{ secrets.BACKUP_DATABASE_URL }}" ] || [ -z "${{ secrets.BACKUP_BUCKET }}" ]; then
            echo "Backup secrets not configured in repository. Skipping backup."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      - name: Install PostgreSQL client and AWS CLI
        if: steps.check_secrets.outputs.skip != 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client awscli
      - name: Back up
        if: steps.check_secrets.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
          BACKUP_ENDPOINT: ${{ secrets.BACKUP_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: ./ops/pg_backup.sh
