name: Native Cross-Platform Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Windows Desktop Build (Tauri 2.0 -> .exe NSIS installer)
  build-desktop-windows:
    name: Desktop - Windows (x64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Build Tauri Windows Bundle
        run: npx tauri build --target x86_64-pc-windows-msvc --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: LanternEd-Windows-Setup
          path: frontend/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

  # 2. macOS Desktop Build (Tauri 2.0 -> .dmg Universal Apple Silicon + Intel)
  build-desktop-macos:
    name: Desktop - macOS (Universal)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Build Tauri macOS Universal Bundle
        run: npx tauri build --target universal-apple-darwin --bundles dmg
      - uses: actions/upload-artifact@v4
        with:
          name: LanternEd-macOS-Universal-DMG
          path: frontend/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  # 3. Android Mobile Build (Capacitor -> .apk)
  build-mobile-android:
    name: Mobile - Android (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Sync Capacitor Android
        run: npx cap sync android
      - name: Setup Android SDK Environment & Keystore
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n856480a6d0fa0783cf76ced1ad3687d49e8b173e\n2fa2d1802312d4d745eb17750882e92860f0b26f" > "$ANDROID_HOME/licenses/android-googletv-license"
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
            yes | sdkmanager --licenses || true
            sdkmanager "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" || true
          fi
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          mkdir -p android/app
          cp ~/.android/debug.keystore android/app/debug.keystore 2>/dev/null || true
      - name: Build Android APK
        run: |
          cd android
          chmod +x ./gradlew
          (./gradlew assembleDebug assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace) 2>&1 | tee gradle_build.log
          apk_file=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$apk_file" ]; then
            cp "$apk_file" app/build/outputs/apk/LanternEd-v0.1.1.apk
          fi
      - name: Report Android Failure to Summary
        if: failure()
        run: |
          echo "### Android Build Failure" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 80 android/gradle_build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: LanternEd-Android-Release-APK
          path: frontend/android/app/build/outputs/apk/**/*.apk

  # 4. iOS Mobile Build (Capacitor -> iOS App & IPA)
  build-mobile-ios:
    name: Mobile - iOS (Xcode Project)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Sync Capacitor iOS
        run: npx cap sync ios
      - name: Build iOS Xcode App & Package
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO SYMROOT="$(pwd)/build" clean build
          else
            xcodebuild -project App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO SYMROOT="$(pwd)/build" clean build
          fi
          mkdir -p build/Release-iphoneos/Payload
          cp -r build/Release-iphoneos/App.app build/Release-iphoneos/Payload/
          cd build/Release-iphoneos
          zip -r LanternEd-v0.1.1.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: LanternEd-iOS-Build
          path: |
            frontend/ios/App/build/Release-iphoneos/*.ipa
            frontend/ios/App/build/Release-iphoneos/App.app

  # 5. Publish to Dedicated App Releases Repository (LanternEd-App-Releases)
  publish-to-releases-repo:
    name: Publish to LanternEd-App-Releases Repository
    needs: [build-desktop-windows, build-desktop-macos, build-mobile-android, build-mobile-ios]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: LanternEd-Windows-Setup
          path: releases/windows/
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: LanternEd-macOS-Universal-DMG
          path: releases/macos/
      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: LanternEd-Android-Release-APK
          path: releases/android/
      - name: Download iOS Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: LanternEd-iOS-Build
          path: releases/ios/
      - name: Normalize Downloaded Artifacts
        run: |
          for p in windows macos android ios; do
            if [ -d "releases/$p" ]; then
              find "releases/$p" -mindepth 2 -type f -exec mv {} "releases/$p/" \; || true
            fi
          done
          if [ ! -f "releases/android/LanternEd-v0.1.1.apk" ]; then
            apk_file=$(find releases/android -name "*.apk" | head -n 1)
            if [ -n "$apk_file" ]; then
              cp "$apk_file" releases/android/LanternEd-v0.1.1.apk
            fi
          fi
      - name: Update Manifest and Checksums
        run: python scripts/package_release.py --action update-hashes
      - name: Push to LanternEd-App-Releases
        env:
          APP_RELEASES_TOKEN: ${{ secrets.APP_RELEASES_TOKEN || secrets.APP_RELEASES_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$APP_RELEASES_TOKEN" ]; then
            python scripts/sync_to_app_releases_repo.py \
              --target-dir ./export_releases \
              --git-remote "https://${APP_RELEASES_TOKEN}@github.com/yynvr1408/LanternEd-App-Releases.git" \
              --push
          else
            echo "APP_RELEASES_TOKEN secret not configured; skipping automatic cross-repo push."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            releases/windows/*
            releases/macos/*
            releases/android/*
            releases/ios/*
            releases/manifest.json
          generate_release_notes: true
