name: Build Validation CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUBLISH_DISABLED: "true"

jobs:
  # Stage 1: Verify 4-app SemVer parity, test & build core web bundle once into dist/
  web-build:
    name: Stage 1 - Web Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify SemVer parity across Windows, macOS, Android, iOS & Manifest
        run: python scripts/ci_release.py verify-versions

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install web dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint web codebase
        working-directory: frontend
        run: npx oxlint

      - name: Typecheck TypeScript
        working-directory: frontend
        run: npx tsc -b

      - name: Run web unit tests
        working-directory: frontend
        run: npx vitest run

      - name: Build production web dist bundle
        working-directory: frontend
        run: npx vite build

      - name: Verify dist output
        working-directory: frontend
        run: test -f dist/index.html

      - name: Upload web-dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 3

  # Stage 2: Test & validate all 4 native wrappers against the exact same web-dist artifact (no publish)
  validate-platforms:
    name: Stage 2 - ${{ matrix.label }}
    needs: web-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            label: Windows (Tauri x64)
            runner: windows-latest
          - platform: macos
            label: macOS (Tauri Universal)
            runner: macos-latest
          - platform: ios
            label: iOS (Capacitor Xcode)
            runner: macos-latest
          - platform: android
            label: Android (Capacitor Gradle)
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: frontend
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Download shared web-dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: frontend/dist

      - name: Verify downloaded web-dist bundle
        run: test -f dist/index.html

      # --- Windows (Tauri v2, Rust tests + --no-sign build) ---
      - name: Setup Rust toolchain (Windows)
        if: matrix.platform == 'windows'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies (Windows)
        if: matrix.platform == 'windows'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Run Windows Tauri Rust unit tests
        if: matrix.platform == 'windows'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Package Windows desktop app (no publish)
        if: matrix.platform == 'windows'
        run: |
          npx tauri build --ci \
            --config "$GITHUB_WORKSPACE/frontend/src-tauri/tauri.ci.conf.json" \
            --target x86_64-pc-windows-msvc \
            --bundles nsis,msi \
            --no-sign
          mkdir -p "$GITHUB_WORKSPACE/staged/windows"
          find src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis -maxdepth 1 -type f -name "*.exe" -exec cp {} "$GITHUB_WORKSPACE/staged/windows/" \;
          find src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi -maxdepth 1 -type f -name "*.msi" -exec cp {} "$GITHUB_WORKSPACE/staged/windows/" \; || true
          ls -lh "$GITHUB_WORKSPACE/staged/windows"

      # --- macOS (Tauri v2 Universal, Rust tests + --no-sign build) ---
      - name: Setup Rust toolchain (macOS)
        if: matrix.platform == 'macos'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Cache Rust dependencies (macOS)
        if: matrix.platform == 'macos'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Run macOS Tauri Rust unit tests
        if: matrix.platform == 'macos'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Package macOS desktop app (no publish)
        if: matrix.platform == 'macos'
        run: |
          npx tauri build --ci \
            --config "$GITHUB_WORKSPACE/frontend/src-tauri/tauri.ci.conf.json" \
            --target universal-apple-darwin \
            --bundles dmg,app \
            --no-sign
          mkdir -p "$GITHUB_WORKSPACE/staged/macos"
          find src-tauri/target/universal-apple-darwin/release/bundle/dmg -maxdepth 1 -type f -name "*.dmg" -exec cp {} "$GITHUB_WORKSPACE/staged/macos/" \;
          APP_BUNDLE=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -type d -name "*.app" | head -n 1 || true)
          if [ -n "$APP_BUNDLE" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$APP_BUNDLE" "$GITHUB_WORKSPACE/staged/macos/LanternEd-macos-universal.app.zip"
          fi
          ls -lh "$GITHUB_WORKSPACE/staged/macos"

      # --- Android (Capacitor v8 + JUnit unit tests + Gradle APK/AAB) ---
      - name: Setup Java 21 (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK & debug fallback keystore
        if: matrix.platform == 'android'
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n856480a6d0fa0783cf76ced1ad3687d49e8b173e\n2fa2d1802312d4d745eb17750882e92860f0b26f\n" > "$ANDROID_HOME/licenses/android-googletv-license"
          if [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
          fi
          mkdir -p android/app
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Sync web-dist, run Android native JUnit tests & build APK/AAB (no publish)
        if: matrix.platform == 'android'
        run: |
          npx cap sync android
          cd android
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --stacktrace
          ./gradlew assembleRelease bundleRelease --stacktrace
          mkdir -p "$GITHUB_WORKSPACE/staged/android"
          APK_FILE=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1 || true)
          AAB_FILE=$(find app/build/outputs/bundle -type f -name "*.aab" | head -n 1 || true)
          if [ -n "$APK_FILE" ]; then cp "$APK_FILE" "$GITHUB_WORKSPACE/staged/android/"; fi
          if [ -n "$AAB_FILE" ]; then cp "$AAB_FILE" "$GITHUB_WORKSPACE/staged/android/"; fi
          ls -lh "$GITHUB_WORKSPACE/staged/android"

      # --- iOS (Capacitor v8 + Xcode Swift native plugin + SPM, unsigned build, no publish) ---
      - name: Sync web-dist & build unsigned iOS app (no publish)
        if: matrix.platform == 'ios'
        run: |
          npx cap sync ios
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
              SYMROOT="$(pwd)/build" clean build
          else
            xcodebuild -project App.xcodeproj -scheme App -configuration Release \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
              SYMROOT="$(pwd)/build" clean build
          fi
          mkdir -p "$GITHUB_WORKSPACE/staged/ios" build/Release-iphoneos/Payload
          cp -R build/Release-iphoneos/App.app build/Release-iphoneos/Payload/
          (cd build/Release-iphoneos && zip -qry "$GITHUB_WORKSPACE/staged/ios/LanternEd-ios-unsigned.ipa" Payload)
          ls -lh "$GITHUB_WORKSPACE/staged/ios"

      - name: Upload validated native installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: validated-${{ matrix.platform }}
          path: staged/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 3
